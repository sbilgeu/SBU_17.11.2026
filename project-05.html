
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S STUDIO — Project</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, Helvetica, sans-serif;
}

:root {
    --header-height: 24px;
    --cell-width: 50px;
    --cell-height: 50px;
    --grid-viewport-height: 600px;
    --grid-line-color: #b0b0b0;
}

/* HEADER */
#topbar {
    position: relative;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: var(--header-height);
    min-height: 20px;
    padding: 0 12px;
    background: black;
}

#brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 0 7px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2px;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
}

#brand:hover {
    color: red;
    background: white;
    box-shadow: -12px 0 white, 12px 0 white;
}

/* MENU */
#nav-links {
    position: relative;
    display: flex;
    align-items: center;
    height: 100%;
}

#menu-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 0 7px;
    background: transparent;
    border: none;
    cursor: pointer;
}

#menu-button:hover,
#menu-button[aria-expanded="true"] {
    background: white;
    box-shadow: -12px 0 white, 12px 0 white;
}

.menu-icon {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 15px;
    height: 12px;
}

.menu-icon span {
    display: block;
    width: 100%;
    height: 1px;
    background: white;
}

#menu-button:hover .menu-icon span,
#menu-button[aria-expanded="true"] .menu-icon span {
    background: red;
}

/* DROPDOWN MENU */
#dropdown-menu {
    position: absolute;
    top: 100%;
    right: -12px;
    z-index: 35;
    display: none;
    flex-direction: column;
    width: calc(2 * var(--cell-width));
    height: calc(2 * var(--cell-height));
    padding-top: 10px;
    background: black;
}

#dropdown-menu.open {
    display: flex;
}

.dropdown-link {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    width: 100%;
    min-height: 30px;
    padding: 6px 19px;
    background: black;
    color: white;
    font-size: 12px;
    text-align: right;
    text-decoration: none;
    white-space: nowrap;
}

.dropdown-link:hover,
.dropdown-link:focus-visible {
    color: red;
    background: white;
    outline: none;
}

/* FIXED GRID */
#grid {
    position: relative;
    width: 100%;
    height: var(--grid-viewport-height);
    overflow: hidden;
    background: white;
}

#project-content {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: white;
    background-image:
        linear-gradient(
            to right,
            var(--grid-line-color) 1px,
            transparent 1px
        ),
        linear-gradient(
            to bottom,
            var(--grid-line-color) 1px,
            transparent 1px
        );
    background-size:
        var(--cell-width) var(--cell-height),
        var(--cell-width) var(--cell-height);
    background-position: 0 0;
}

/* BLACK CONTENT AREA */
#coming-soon {
    position: absolute;
    top: var(--cell-height);
    left: var(--cell-width);
    width: calc(100% - 2 * var(--cell-width));
    height: calc(100% - 2 * var(--cell-height));
    display: flex;
    align-items: center;
    justify-content: center;
    background: black;
    color: white;
    font-size: clamp(16px, 2vw, 28px);
    font-weight: 400;
    letter-spacing: .02em;
    text-align: center;
}

/* PROJECT NAVIGATION */
.nav-button {
    position: fixed;
    top: 50%;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 64px;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    cursor: pointer;
    text-decoration: none;
}

#previous-project {
    left: 0;
}

#next-project {
    right: 0;
}

.triangle {
    display: block;
    width: 0;
    height: 0;
    border-style: solid;
    transition: border-color .15s ease;
}

#previous-project .triangle {
    border-width: 10px 14px 10px 0;
    border-color:
        transparent black transparent transparent;
}

#next-project .triangle {
    border-width: 10px 0 10px 14px;
    border-color:
        transparent transparent transparent black;
}

#previous-project:hover .triangle,
#previous-project:focus-visible .triangle {
    border-right-color: red;
}

#next-project:hover .triangle,
#next-project:focus-visible .triangle {
    border-left-color: red;
}

/* MOBILE */
@media (max-width: 768px) {
    #topbar {
        padding: 0 8px;
    }

    #brand {
        padding: 0 5px;
        font-size: 11px;
    }

    #menu-button {
        padding: 0 5px;
    }

    #brand:hover {
        box-shadow: -8px 0 white, 8px 0 white;
    }

    #menu-button:hover,
    #menu-button[aria-expanded="true"] {
        box-shadow: -8px 0 white, 8px 0 white;
    }

    #dropdown-menu {
        right: -8px;
        padding-top: 5px;
    }

    .dropdown-link {
        min-height: 27px;
        padding: 5px 13px;
        font-size: 11px;
    }

    .nav-button {
        width: 32px;
        height: 48px;
    }

    #previous-project .triangle {
        border-width: 8px 11px 8px 0;
    }

    #next-project .triangle {
        border-width: 8px 0 8px 11px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header id="topbar">
    <a href="index.html" id="brand">S STUDIO</a>

    <nav id="nav-links" aria-label="Ana menü">
        <button
            id="menu-button"
            type="button"
            aria-label="Menüyü aç"
            aria-expanded="false"
            aria-controls="dropdown-menu"
        >
            <span class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </button>

        <div id="dropdown-menu">
            <a href="about-us.html" class="dropdown-link">about us</a>
            <a href="work.html" class="dropdown-link">work</a>
            <a href="contact.html" class="dropdown-link">contact</a>
        </div>
    </nav>
</header>

<!-- GRID -->
<main id="grid">
    <section id="project-content">
        <div id="coming-soon">on the way</div>
    </section>
</main>

<!-- PREVIOUS PROJECT -->
<a
    id="previous-project"
    class="nav-button"
    href="project-04.html"
    aria-label="Önceki proje"
>
    <span class="triangle"></span>
</a>

<!-- NEXT PROJECT -->
<a
    id="next-project"
    class="nav-button"
    href="project-06.html"
    aria-label="Sonraki proje"
>
    <span class="triangle"></span>
</a>

<script>
/* MENU */
const menuButton = document.getElementById("menu-button");
const dropdownMenu = document.getElementById("dropdown-menu");
const navLinks = document.getElementById("nav-links");

function setMenuOpen(open) {
    dropdownMenu.classList.toggle("open", open);
    menuButton.setAttribute("aria-expanded", String(open));
    menuButton.setAttribute(
        "aria-label",
        open ? "Menüyü kapat" : "Menüyü aç"
    );
}

menuButton.addEventListener("click", event => {
    event.stopPropagation();
    setMenuOpen(!dropdownMenu.classList.contains("open"));
});

document.addEventListener("click", event => {
    if (!navLinks.contains(event.target)) {
        setMenuOpen(false);
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        setMenuOpen(false);
    }
});

/* PROJECT NAVIGATION */
const PROJECT_COUNT = 10;
const DEFAULT_PROJECT = 5;

function getCurrentProjectNumber() {
    const filename = window.location.pathname
        .split("/")
        .pop();

    const match = filename.match(/^project-(\d+)\.html$/i);

    if (match) {
        const number = parseInt(match[1], 10);

        if (number >= 1 && number <= PROJECT_COUNT) {
            return number;
        }
    }

    return DEFAULT_PROJECT;
}

function projectURL(number) {
    return "project-" +
        String(number).padStart(2, "0") +
        ".html";
}

function setupProjectNavigation() {
    const current = getCurrentProjectNumber();

    const previous = current === 1
        ? PROJECT_COUNT
        : current - 1;

    const next = current === PROJECT_COUNT
        ? 1
        : current + 1;

    document.getElementById("previous-project").href =
        projectURL(previous);

    document.getElementById("next-project").href =
        projectURL(next);

    document.title =
        "S STUDIO — Project " +
        String(current).padStart(2, "0");
}

/* GRID VARIABLES */
let columns = 1;
let rows = 1;
let cellWidth = 50;
let cellHeight = 50;

/* RESPONSIVE GRID CALCULATION */
function calculateGrid() {
    const width = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const landscape = width >= viewportHeight;

    const minDivisor = landscape ? 4 : 2.5;
    const maxDivisor = landscape ? 8 : 4;
    const preferredDivisor = landscape ? 8 : 2.8;

    let bestScore = Infinity;
    let best = null;

    for (
        let divisor = minDivisor;
        divisor <= maxDivisor + 0.001;
        divisor += 0.1
    ) {
        let availableHeight = viewportHeight;
        let testColumns = 1;
        let testRows = 1;
        let testCellWidth = 1;
        let testCellHeight = 1;
        let headerHeight = 0;

        for (let iteration = 0; iteration < 4; iteration++) {
            const baseSize = Math.min(width, availableHeight);
            const targetSize = baseSize / divisor;

            testColumns = Math.max(
                1,
                Math.round(width / targetSize)
            );

            testRows = Math.max(
                1,
                Math.round(availableHeight / targetSize)
            );

            testCellWidth = width / testColumns;
            testCellHeight = availableHeight / testRows;

            headerHeight = testCellHeight / 4;
            availableHeight = viewportHeight - headerHeight;
        }

        const ratioError = Math.abs(
            Math.log(testCellWidth / testCellHeight)
        );

        const sizePenalty =
            Math.abs(divisor - preferredDivisor) * 0.0005;

        const score = ratioError + sizePenalty;

        if (score < bestScore) {
            bestScore = score;

            best = {
                columns: testColumns,
                rows: testRows,
                headerHeight
            };
        }
    }

    columns = best.columns;
    rows = best.rows;

    cellWidth = width / columns;
    cellHeight =
        (viewportHeight - best.headerHeight) / rows;

    const gridViewportHeight =
        viewportHeight - best.headerHeight;

    document.documentElement.style.setProperty(
        "--header-height",
        best.headerHeight + "px"
    );

    document.documentElement.style.setProperty(
        "--cell-width",
        cellWidth + "px"
    );

    document.documentElement.style.setProperty(
        "--cell-height",
        cellHeight + "px"
    );

    document.documentElement.style.setProperty(
        "--grid-viewport-height",
        gridViewportHeight + "px"
    );
}

/* RESIZE */
let resizeTimeout;

window.addEventListener("resize", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(calculateGrid, 100);
});

window.addEventListener("orientationchange", () => {
    setTimeout(calculateGrid, 150);
});

/* INITIALIZE */
setupProjectNavigation();
calculateGrid();
</script>

</body>
</html>
